<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">


        <style>
            * {
                margin: 0;
                padding: 0;
            }

            body {
                background-color: black;
                font-size: 12px;
            }

            .only {
                width: 100vw;
                height: 95vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .bg {
                position: fixed;
                z-index: -1;
                top: 0;
                right: 0;
                bottom: 0;
                left: 0;
                transition: .25s;
                pointer-events: none;
            }

            .text {
                display: flex;
                flex-direction: column;
            }

            a {
                text-decoration: none;
                color: white;
                font-family: 'Press Start 2P', cursive;
                font-size: 1.1rem;
                margin: 5px 0;
            }

            #asteroids:hover ~ .bg {
                background-color: #96ff5d;
   
            }

            #battleships:hover ~ .bg {
                background-color: white;
            }

            #snake:hover ~ .bg {
                background-color: #f6ae33;
            }

            #tetris:hover ~ .bg {
                background-color: #00bfff
            }


        </style>
    </head>
    <body> 
        <div class="only">
            <div class="text">
                <a href="./ASTEROIDS/index.html" id="asteroids">Asteroids</a>
                <a href="./BATTLESHIPS/public/index.html" id="battleships">Battleships</a>
                <a href="./SNAKE/public/index.html" id="snake">Snake</a>
                <a href="./TETRIS/index.html" id="tetris">Tetris</a>
                <div class="bg"></div>
            </div>
        </div>
        
        <script src="" async defer></script>
    </body>
</html>
